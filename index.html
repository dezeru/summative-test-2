<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2nd Summative Test - Computer Programming (.NET)</title>
<style>
  :root {
    --primary: #1e3a8a;
    --primary-hover: #172554;
    --success: #16a34a;
    --danger: #dc2626;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    max-width: 600px;
    margin: 0 auto;
    background: var(--card);
    position: relative;
  }

  /* ---------------- START SCREEN ---------------- */
  #start-screen {
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }
  .school-title { text-align: center; margin-bottom: 16px; }
  .school-title h2 { margin: 0; color: var(--primary); font-size: 1.2rem; }
  .school-title p { margin: 4px 0 0; color: #64748b; font-size: 0.88rem; }

  .instructions-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 14px 0;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #334155;
  }
  .instructions-box ul { margin: 6px 0 0 16px; padding: 0; }
  .instructions-box li { margin-bottom: 4px; }

  .name-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 14px 0;
  }
  .input-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #475569; margin-bottom: 4px; }
  .input-field {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    outline: none;
  }
  .input-field:focus { border-color: var(--primary); }

  /* ---------------- EXAM SCREEN (PINNED LAYOUT) ---------------- */
  #exam-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  /* Pinned Top Bar */
  .pinned-top {
    flex-shrink: 0;
    background: var(--card);
    padding: 10px 14px 6px;
    border-bottom: 1px solid #e2e8f0;
    z-index: 10;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .timer {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--danger);
    background: #fee2e2;
    padding: 3px 9px;
    border-radius: 9999px;
    letter-spacing: 0.05em;
  }
  .progress-info { font-weight: 600; color: #475569; font-size: 0.82rem; }

  /* Linear Progress Bar */
  .progress-bar-container {
    width: 100%;
    height: 6px;
    background-color: #e2e8f0;
    border-radius: 9999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background-color: var(--primary);
    transition: width 0.25s ease;
  }

  /* 30-Item All-Visible Grid (10 Columns x 3 Rows) */
  .palette-grid-wrap {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    padding: 4px 0 2px;
  }
  .palette-btn {
    height: 25px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #f8fafc;
    color: #475569;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.15s ease;
  }
  .palette-btn.active {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
    color: var(--primary);
    background: #eff6ff;
    font-weight: 700;
  }
  .palette-btn.answered {
    background: var(--success);
    color: #ffffff;
    border-color: var(--success);
  }
  .palette-btn.answered.active {
    outline: 2px solid #064e3b;
    outline-offset: 1px;
  }

  /* Center Question Area */
  .question-scroll-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .question-title {
    font-size: 0.98rem;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.45;
    color: var(--text);
  }
  .option {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 11px 13px;
    margin-bottom: 9px;
    cursor: pointer;
    background: #ffffff;
    font-size: 0.88rem;
    line-height: 1.35;
  }
  .option:hover { background: #f8fafc; border-color: var(--primary); }
  .option input {
    margin-right: 10px;
    transform: scale(1.15);
    flex-shrink: 0;
  }

  /* Pinned Bottom Navigation */
  .pinned-bottom {
    flex-shrink: 0;
    background: var(--card);
    border-top: 1px solid #e2e8f0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    z-index: 10;
  }
  button {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-prev { background: #e2e8f0; color: #334155; }
  .btn-prev:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-next { background: var(--primary); color: white; }
  .btn-submit { background: var(--success); color: white; display: none; }

  /* ---------------- MODAL / RESULT ---------------- */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
  }
  .modal {
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    padding: 20px;
    border-radius: 12px;
  }
  .modal h3 { margin-top: 0; color: #b45309; font-size: 1.05rem; }
  .modal p { font-size: 0.88rem; line-height: 1.45; color: #475569; }
  .modal .unanswered-list {
    background: #fef3c7;
    border: 1px solid #fde68a;
    padding: 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    color: #92400e;
    max-height: 90px;
    overflow-y: auto;
    margin: 12px 0;
    font-weight: 600;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .btn-secondary { background: #e2e8f0; color: #334155; }
</style>
</head>
